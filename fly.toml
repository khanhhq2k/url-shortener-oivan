# fly.toml app configuration file generated for bitly-clone-assignment on 2026-05-12T04:10:52+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bitly-clone-assignment'
primary_region = 'sin'
console_command = '/rails/bin/rails console'

[build]

[env]
  HTTP_PORT = '8080'
  TARGET_PORT = '3000'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
